[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceagent"
version = "0.1.0"
description = "Gegenprobe: rechnet Excel-Mappen offline nach und zeigt jeden Fehler mit Ursache und Korrektur"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # Tabellen aus PDF-Dateien für den Excel-Helfer (reines Python, etwa 4 MB).
    "pypdf>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
voiceagent = "voiceagent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voiceagent = ["web/*", "web/demo/*", "web/addin/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
