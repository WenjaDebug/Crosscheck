name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pakete installieren
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q

  # Windows: installiert wie VoiceAgent.bat (nur Python kommt hier nicht über winget).
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.13"
      - name: Gegenprobe installieren (scripts\install-windows.ps1 in Windows PowerShell)
        env:
          VOICEAGENT_PYTHON: ${{ steps.python.outputs.python-path }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install-windows.ps1
      - name: Tests
        run: |
          .venv\Scripts\python.exe -m pip install pytest httpx --quiet
          .venv\Scripts\python.exe -m pytest -q
